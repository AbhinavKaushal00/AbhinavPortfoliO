    <script>
        // Smooth scrolling for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();

                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const closeMobileMenuButton = document.getElementById('close-mobile-menu');

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.remove('hidden');
        });

        closeMobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
        });

        // Close mobile menu when a link is clicked inside it
        mobileMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });

        // Simple animation on scroll (optional, for hero section)
        const heroSection = document.getElementById('hero');
        const heroElements = heroSection.querySelectorAll('.animate-fade-in-down, .animate-fade-in-up');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('opacity-100', 'translate-y-0');
                    entry.target.classList.remove('opacity-0', '-translate-y-4', 'translate-y-4');
                } else {
                    // Optional: reset animation when out of view
                    // entry.target.classList.remove('opacity-100', 'translate-y-0');
                    // if (entry.target.classList.contains('animate-fade-in-down')) {
                    //     entry.target.classList.add('opacity-0', '-translate-y-4');
                    // } else if (entry.target.classList.contains('animate-fade-in-up')) {
                    //     entry.target.classList.add('opacity-0', 'translate-y-4');
                    // }
                }
            });
        }, { threshold: 0.1 }); // Trigger when 10% of the element is visible

        heroElements.forEach(el => {
            el.classList.add('opacity-0'); // Initial state for animation
            if (el.classList.contains('animate-fade-in-down')) {
                el.classList.add('-translate-y-4');
            } else if (el.classList.contains('animate-fade-in-up')) {
                el.classList.add('translate-y-4');
            }
            observer.observe(el);
        });
    </script>
